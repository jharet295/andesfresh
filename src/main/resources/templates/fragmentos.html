<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header th:fragment="menu" class="menu">
  <strong>Andes Fresh</strong>
  <a th:href="@{/productos}">Productos</a>
  <a th:href="@{/productos/nuevo}">Nuevo producto</a>
  <a sec:authorize="hasRole('ADMIN')" th:href="@{/usuarios}">Usuarios</a>
  <span class="usuario" sec:authorize="isAuthenticated()">
    Hola, <b sec:authentication="name">usuario</b>
    <form th:action="@{/logout}" method="post" class="en-linea">
      <button type="submit">Salir</button>
    </form>
  </span>
</header>
</body>
</html>
